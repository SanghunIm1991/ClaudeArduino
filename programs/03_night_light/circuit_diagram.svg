<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="sans-serif">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <!-- 区切り線 -->
  <line x1="330" y1="10" x2="330" y2="430" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== 左パネル: CdS明暗検知回路（分圧） ===== -->
  <text x="160" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">CdS明暗検知回路（分圧）</text>

  <!-- +5V rail -->
  <text x="160" y="48" text-anchor="middle" font-size="14" fill="#000">+5V</text>
  <line x1="160" y1="55" x2="160" y2="75" stroke="#000" stroke-width="2"/>

  <!-- resistor zigzag (vertical) R1: 10kΩ -->
  <polyline points="160,75 148,85 172,95 148,105 172,115 148,125 160,135"
            fill="none" stroke="#000" stroke-width="2"/>
  <text x="185" y="108" font-size="14" fill="#000">R1: 10kΩ</text>

  <line x1="160" y1="135" x2="160" y2="160" stroke="#000" stroke-width="2"/>
  <circle cx="160" cy="160" r="3" fill="#000"/>

  <!-- tap to A0 -->
  <line x1="160" y1="160" x2="260" y2="160" stroke="#000" stroke-width="2"/>
  <text x="270" y="165" font-size="14" fill="#000">A0 (アナログ入力)</text>

  <line x1="160" y1="160" x2="160" y2="185" stroke="#000" stroke-width="2"/>

  <!-- CdS symbol: 円で囲んだ抵抗ジグザグ + 入射光矢印（フォトレジスタの標準的な記号） -->
  <circle cx="160" cy="230" r="40" fill="none" stroke="#000" stroke-width="2"/>
  <polyline points="160,195 148,203 172,211 148,219 172,227 148,235 172,243 148,251 160,259"
            fill="none" stroke="#000" stroke-width="2"/>
  <!-- 入射光矢印（CdSは光で抵抗値が変化することを示す） -->
  <line x1="115" y1="190" x2="133" y2="208" stroke="#000" stroke-width="1.5"/>
  <polygon points="133,208 122,206 125,197" fill="#000"/>
  <line x1="205" y1="190" x2="187" y2="208" stroke="#000" stroke-width="1.5"/>
  <polygon points="187,208 198,206 195,197" fill="#000"/>
  <text x="215" y="235" font-size="13" fill="#000">CdSセル</text>
  <text x="215" y="252" font-size="12" fill="#333">（明るいほど抵抗小）</text>

  <line x1="160" y1="270" x2="160" y2="360" stroke="#000" stroke-width="2"/>

  <!-- ground symbol -->
  <line x1="140" y1="360" x2="180" y2="360" stroke="#000" stroke-width="2"/>
  <line x1="146" y1="368" x2="174" y2="368" stroke="#000" stroke-width="2"/>
  <line x1="152" y1="376" x2="168" y2="376" stroke="#000" stroke-width="2"/>
  <text x="160" y="398" text-anchor="middle" font-size="13" fill="#000">GND</text>

  <text x="160" y="420" text-anchor="middle" font-size="12" fill="#333">暗いほどA0の読み取り値が大きくなる配線</text>

  <!-- ===== 中央パネル: スイッチ回路（プルダウン、②と同様） ===== -->
  <text x="500" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">モード切替スイッチ（プルダウン）</text>

  <text x="500" y="48" text-anchor="middle" font-size="14" fill="#000">+5V</text>
  <line x1="500" y1="55" x2="500" y2="75" stroke="#000" stroke-width="2"/>

  <circle cx="500" cy="75" r="3" fill="#000"/>
  <line x1="500" y1="75" x2="514" y2="112" stroke="#000" stroke-width="2"/>
  <circle cx="500" cy="120" r="3" fill="#000"/>
  <text x="530" y="100" font-size="13" fill="#000">SW1 タクトスイッチ</text>

  <line x1="500" y1="120" x2="500" y2="150" stroke="#000" stroke-width="2"/>
  <circle cx="500" cy="150" r="3" fill="#000"/>

  <line x1="500" y1="150" x2="600" y2="150" stroke="#000" stroke-width="2"/>
  <text x="610" y="155" font-size="14" fill="#000">D2 (デジタル入力)</text>
  <text x="500" y="172" text-anchor="middle" font-size="11" fill="#333">短押しでAUTO→ON→OFFと循環</text>

  <line x1="500" y1="150" x2="500" y2="185" stroke="#000" stroke-width="2"/>

  <!-- resistor zigzag (vertical) R2: 10kΩ pulldown -->
  <polyline points="500,185 488,195 512,205 488,215 512,225 488,235 500,245"
            fill="none" stroke="#000" stroke-width="2"/>
  <text x="525" y="218" font-size="14" fill="#000">R2: 10kΩ</text>
  <text x="525" y="234" font-size="12" fill="#333">（プルダウン）</text>

  <line x1="500" y1="245" x2="500" y2="360" stroke="#000" stroke-width="2"/>

  <line x1="480" y1="360" x2="520" y2="360" stroke="#000" stroke-width="2"/>
  <line x1="486" y1="368" x2="514" y2="368" stroke="#000" stroke-width="2"/>
  <line x1="492" y1="376" x2="508" y2="376" stroke="#000" stroke-width="2"/>
  <text x="500" y="398" text-anchor="middle" font-size="13" fill="#000">GND</text>

  <!-- ===== 右パネル: MOS-FET駆動LED回路 ===== -->
  <text x="820" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">MOS-FET駆動LED回路（3灯並列）</text>

  <!-- +5V rail across three LED branches -->
  <text x="820" y="48" text-anchor="middle" font-size="14" fill="#000">+5V</text>
  <line x1="820" y1="55" x2="820" y2="70" stroke="#000" stroke-width="2"/>
  <line x1="720" y1="70" x2="920" y2="70" stroke="#000" stroke-width="2"/>
  <line x1="820" y1="55" x2="820" y2="70" stroke="#000" stroke-width="2"/>

  <!-- Branch 1: Red LED, 1kΩ -->
  <line x1="720" y1="70" x2="720" y2="90" stroke="#000" stroke-width="2"/>
  <polyline points="720,90 708,98 732,106 708,114 732,122 708,130 720,138"
            fill="none" stroke="#000" stroke-width="2"/>
  <text x="738" y="112" font-size="11" fill="#000">1kΩ</text>
  <line x1="720" y1="138" x2="720" y2="155" stroke="#000" stroke-width="2"/>
  <polygon points="705,155 735,155 720,178" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="705" y1="178" x2="735" y2="178" stroke="#000" stroke-width="2"/>
  <text x="720" y="196" text-anchor="middle" font-size="11" fill="#000">LED1赤</text>
  <line x1="720" y1="178" x2="720" y2="230" stroke="#000" stroke-width="2"/>

  <!-- Branch 2: White LED, 330Ω -->
  <line x1="820" y1="70" x2="820" y2="90" stroke="#000" stroke-width="2"/>
  <polyline points="820,90 808,98 832,106 808,114 832,122 808,130 820,138"
            fill="none" stroke="#000" stroke-width="2"/>
  <text x="838" y="112" font-size="11" fill="#000">330Ω</text>
  <line x1="820" y1="138" x2="820" y2="155" stroke="#000" stroke-width="2"/>
  <polygon points="805,155 835,155 820,178" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="805" y1="178" x2="835" y2="178" stroke="#000" stroke-width="2"/>
  <text x="820" y="196" text-anchor="middle" font-size="11" fill="#000">LED2白</text>
  <line x1="820" y1="178" x2="820" y2="230" stroke="#000" stroke-width="2"/>

  <!-- Branch 3: Green LED, 270Ω -->
  <line x1="920" y1="70" x2="920" y2="90" stroke="#000" stroke-width="2"/>
  <polyline points="920,90 908,98 932,106 908,114 932,122 908,130 920,138"
            fill="none" stroke="#000" stroke-width="2"/>
  <text x="938" y="112" font-size="11" fill="#000">270Ω</text>
  <line x1="920" y1="138" x2="920" y2="155" stroke="#000" stroke-width="2"/>
  <polygon points="905,155 935,155 920,178" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="905" y1="178" x2="935" y2="178" stroke="#000" stroke-width="2"/>
  <text x="920" y="196" text-anchor="middle" font-size="11" fill="#000">LED3緑</text>
  <line x1="920" y1="178" x2="920" y2="230" stroke="#000" stroke-width="2"/>

  <!-- merge three cathodes into MOSFET drain node -->
  <line x1="720" y1="230" x2="920" y2="230" stroke="#000" stroke-width="2"/>
  <line x1="820" y1="230" x2="820" y2="250" stroke="#000" stroke-width="2"/>
  <text x="700" y="248" font-size="11" fill="#333">（3灯のカソードを共通ドレインへ束ねる）</text>

  <!-- MOSFET symbol (簡略N-ch記号): drain上, source下, gate左。四角囲みにG/D/Sのピン表記を明示（正式なMOSFET回路記号は手描きの複雑さが増すため簡略化） -->
  <line x1="820" y1="250" x2="820" y2="270" stroke="#000" stroke-width="2"/>
  <text x="828" y="262" font-size="10" fill="#333">D</text>
  <rect x="805" y="270" width="30" height="45" fill="none" stroke="#000" stroke-width="2"/>
  <text x="820" y="298" text-anchor="middle" font-size="10" fill="#000">Q1</text>
  <text x="855" y="298" font-size="11" fill="#000">MOS-FET</text>
  <text x="855" y="313" font-size="10" fill="#333">(Nch, ローサイド)</text>
  <text x="789" y="290" text-anchor="end" font-size="10" fill="#333">G</text>
  <text x="828" y="330" font-size="10" fill="#333">S</text>

  <!-- gate line from D9 -->
  <line x1="680" y1="285" x2="805" y2="285" stroke="#000" stroke-width="2"/>
  <!-- gate resistor -->
  <polyline points="680,285 672,278 656,292 640,278 624,292 608,278 600,285"
            fill="none" stroke="#000" stroke-width="2"/>
  <text x="640" y="270" text-anchor="middle" font-size="11" fill="#000">1kΩ（ゲート抵抗）</text>
  <line x1="600" y1="285" x2="560" y2="285" stroke="#000" stroke-width="2"/>
  <text x="555" y="280" text-anchor="end" font-size="14" fill="#000">D9 (デジタル出力/PWM)</text>

  <!-- source to GND -->
  <line x1="820" y1="315" x2="820" y2="360" stroke="#000" stroke-width="2"/>
  <line x1="800" y1="360" x2="840" y2="360" stroke="#000" stroke-width="2"/>
  <line x1="806" y1="368" x2="834" y2="368" stroke="#000" stroke-width="2"/>
  <line x1="812" y1="376" x2="828" y2="376" stroke="#000" stroke-width="2"/>
  <text x="820" y="398" text-anchor="middle" font-size="13" fill="#000">GND</text>

  <text x="820" y="420" text-anchor="middle" font-size="12" fill="#333">ゲートHIGHでMOS-FET導通→3灯点灯</text>
</svg>
