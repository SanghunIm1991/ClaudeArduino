<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <!-- 区切り線 -->
  <line x1="440" y1="10" x2="440" y2="370" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== 左パネル: スイッチ回路（プルダウン） ===== -->
  <text x="150" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">スイッチ回路（プルダウン）</text>

  <!-- +5V rail -->
  <text x="150" y="48" text-anchor="middle" font-size="14" fill="#000">+5V</text>
  <line x1="150" y1="55" x2="150" y2="75" stroke="#000" stroke-width="2"/>

  <!-- switch symbol (open contact): 端子2つ+レバー -->
  <circle cx="150" cy="75" r="3" fill="#000"/>
  <line x1="150" y1="75" x2="164" y2="112" stroke="#000" stroke-width="2"/>
  <circle cx="150" cy="120" r="3" fill="#000"/>
  <text x="190" y="100" font-size="13" fill="#000">SW1 タクトスイッチ</text>

  <!-- wire down to junction -->
  <line x1="150" y1="120" x2="150" y2="150" stroke="#000" stroke-width="2"/>
  <circle cx="150" cy="150" r="3" fill="#000"/>

  <!-- tap to D2 -->
  <line x1="150" y1="150" x2="270" y2="150" stroke="#000" stroke-width="2"/>
  <text x="280" y="155" font-size="14" fill="#000">D2 (デジタル入力)</text>

  <!-- wire down to resistor top (y=160, 右パネルと揃える) -->
  <line x1="150" y1="150" x2="150" y2="160" stroke="#000" stroke-width="2"/>

  <!-- resistor zigzag (vertical) R1: y=160〜220 -->
  <polyline points="150,160 138,170 162,180 138,190 162,200 138,210 150,220"
            fill="none" stroke="#000" stroke-width="2"/>
  <text x="175" y="193" font-size="14" fill="#000">R1: 10kΩ</text>
  <text x="175" y="211" font-size="12" fill="#333">（プルダウン）</text>

  <!-- wire down to GND top (y=300, 右パネルと揃える) -->
  <line x1="150" y1="220" x2="150" y2="300" stroke="#000" stroke-width="2"/>

  <!-- ground symbol -->
  <line x1="130" y1="300" x2="170" y2="300" stroke="#000" stroke-width="2"/>
  <line x1="136" y1="308" x2="164" y2="308" stroke="#000" stroke-width="2"/>
  <line x1="142" y1="316" x2="158" y2="316" stroke="#000" stroke-width="2"/>
  <text x="150" y="336" text-anchor="middle" font-size="13" fill="#000">GND</text>

  <!-- ===== 右パネル: LED回路 ===== -->
  <text x="620" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">LED回路</text>

  <text x="620" y="48" text-anchor="middle" font-size="14" fill="#000">D8 (デジタル出力)</text>
  <!-- 左パネルの「配線+スイッチ+分岐」と同じ長さ(55→160)の直線配線で高さを揃える -->
  <line x1="620" y1="55" x2="620" y2="160" stroke="#000" stroke-width="2"/>

  <!-- resistor zigzag (vertical) R2: y=160〜220 (R1と同じ範囲) -->
  <polyline points="620,160 608,170 632,180 608,190 632,200 608,210 620,220"
            fill="none" stroke="#000" stroke-width="2"/>
  <text x="645" y="193" font-size="14" fill="#000">R2: 1kΩ</text>

  <line x1="620" y1="220" x2="620" y2="235" stroke="#000" stroke-width="2"/>

  <!-- LED symbol: triangle (anode, top) pointing down + bar (cathode) -->
  <polygon points="600,235 640,235 620,262" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="600" y1="262" x2="640" y2="262" stroke="#000" stroke-width="2"/>

  <!-- light-emission arrows（発光を示す矢印、LED記号の右上） -->
  <line x1="645" y1="248" x2="665" y2="228" stroke="#000" stroke-width="1.5"/>
  <polygon points="665,228 655,229 661,237" fill="#000"/>
  <line x1="655" y1="258" x2="675" y2="238" stroke="#000" stroke-width="1.5"/>
  <polygon points="675,238 665,239 671,247" fill="#000"/>

  <text x="590" y="250" text-anchor="end" font-size="13" fill="#000">LED1（赤色）</text>
  <text x="682" y="240" font-size="12" fill="#333">アノード(+) 長い足</text>
  <text x="682" y="265" font-size="12" fill="#333">カソード(-) 短い足</text>

  <!-- wire down to GND top (y=300, 左パネルと揃える) -->
  <line x1="620" y1="262" x2="620" y2="300" stroke="#000" stroke-width="2"/>

  <!-- ground symbol -->
  <line x1="600" y1="300" x2="640" y2="300" stroke="#000" stroke-width="2"/>
  <line x1="606" y1="308" x2="634" y2="308" stroke="#000" stroke-width="2"/>
  <line x1="612" y1="316" x2="628" y2="316" stroke="#000" stroke-width="2"/>
  <text x="620" y="336" text-anchor="middle" font-size="13" fill="#000">GND</text>
</svg>
